<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#003399">
<title>Marschplaner – Planung geschlossener Marschverbände</title>
<meta name="description" content="Marschplaner: Marschverbände planen, GPX-Route laden, Marschtabelle, Marschskizze und Straßenbelegungsplan als PDF ausgeben. Läuft komplett im Browser.">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/blatt.css">
<link rel="stylesheet" href="css/print.css">
<script src="vendor/leaflet/leaflet.js"></script>
<link rel="modulepreload" href="js/app.js">
<link rel="modulepreload" href="js/blaetter.js">
<link rel="modulepreload" href="js/state.js">
<link rel="modulepreload" href="js/rechnen.js">
</head>
<body>

<div id="app">
  <header class="kopf">
    <a class="marke" href="./" aria-label="Marschplaner">
      <svg class="marke-zeichen" viewBox="0 0 40 40" aria-hidden="true">
        <rect width="40" height="40" rx="8" fill="#fff"/>
        <path d="M8 29 L16 17 L22 24 L32 11" fill="none" stroke="#003399" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="8" cy="29" r="3.2" fill="#003399"/>
        <path d="M32 11 l-6 .6 l4.2 4.2z" fill="#003399"/>
      </svg>
      <span class="marke-text">Marschplaner</span>
    </a>
    <input id="projektname" class="projektname" type="text" aria-label="Name der Planung" placeholder="Name der Planung" autocomplete="off">
    <span id="speicherstand" class="speicherstand" role="status"></span>
    <div class="kopf-aktionen">
      <button type="button" id="b-undo" class="kopfknopf" title="Rückgängig (Strg+Z)" aria-label="Rückgängig">↶</button>
      <button type="button" id="b-redo" class="kopfknopf" title="Wiederholen (Strg+Umschalt+Z)" aria-label="Wiederholen">↷</button>
      <button type="button" id="b-projekte" class="kopfknopf text">Planungen</button>
      <button type="button" id="b-vorschau" class="kopfknopf text vorschau-knopf">Vorschau</button>
      <button type="button" id="b-druck" class="kopfknopf text primaer" title="Zur Druckansicht: Blätter wählen, prüfen, drucken oder als PDF speichern">Zum Druck</button>
    </div>
  </header>

  <div class="haupt">
    <nav id="nav" class="nav" aria-label="Arbeitsschritte"></nav>
    <main id="editor" class="editor" tabindex="-1"></main>
    <aside id="vorschau" class="vorschau" aria-label="Vorschau der Blätter">
      <div id="chips" class="chips" role="tablist"></div>
      <div id="flaeche" class="flaeche"></div>
    </aside>
  </div>
</div>

<div id="druck" aria-hidden="true"></div>
<dialog id="dialog" class="dialog"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<noscript><p style="padding:2rem;font-family:sans-serif">Der Marschplaner braucht JavaScript. Es wird nichts nachgeladen oder übertragen – alles läuft in Ihrem Browser.</p></noscript>

<script type="module" src="js/app.js"></script>
</body>
</html>
